services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      STATE_DB_PATH: /data/activation.sqlite3
    volumes:
      - bot_state:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_state:
