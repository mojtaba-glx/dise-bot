[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dise-bot"
version = "1.1.2"
description = "A Telegram dice bot with two intentionally weighted dice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.8,<23",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
dise-bot = "dise_bot.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dise_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
